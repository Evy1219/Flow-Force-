<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow-Force • Commercial OS</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #60a5fa; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; }
    .card { background: #1e2937; padding: 20px; border-radius: 16px; margin: 15px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .tabs { text-align: center; margin: 20px 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .tab { padding: 12px 20px; background: #1e2937; border: none; color: white; border-radius: 50px; cursor: pointer; font-weight: 500; }
    .tab.active { background: #3b82f6; }
    input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #334155; border: none; border-radius: 8px; color: white; }
    button { padding: 12px 20px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
    button:hover { background: #2563eb; }
    li { background: #334155; padding: 14px; margin: 10px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
    .message { padding: 12px; background: #166534; color: #86efac; border-radius: 8px; text-align: center; margin: 10px 0; display: none; }
  </style>
</head>
<body>
  <h1>🌊 Flow-Force Commercial OS</h1>
  <p class="subtitle">Global Commercial Industries • Business Operations Hub • Started 07/24/26</p>

  <div class="tabs">
    <button class="tab active" onclick="showTab(0)">Dashboard</button>
    <button class="tab" onclick="showTab(1)">Leads</button>
    <button class="tab" onclick="showTab(2)">Projects</button>
    <button class="tab" onclick="showTab(3)">Sales</button>
    <button class="tab" onclick="showTab(4)">Tasks</button>
    <button class="tab" onclick="showTab(5)">Expenses</button>
  </div>

  <!-- Dashboard -->
  <div id="tab0" class="tab-content">
    <div class="card">
      <h2>Business Overview</h2>
      <p>Total Leads: <strong id="totalLeads">0</strong> | Active Projects: <strong id="activeProjects">0</strong></p>
      <canvas id="dashboardChart" height="180"></canvas>
    </div>
  </div>

  <!-- Leads -->
  <div id="tab1" class="tab-content" style="display:none">
    <div class="card">
      <h2>New Lead</h2>
      <input type="text" id="leadName" placeholder="Company / Client Name">
      <input type="text" id="leadContact" placeholder="Contact Person or Email">
      <select id="leadStatus">
        <option value="New">New</option>
        <option value="Contacted">Contacted</option>
        <option value="Negotiation">Negotiation</option>
        <option value="Closed">Closed Won</option>
      </select>
      <button onclick="addLead()">Add Lead</button>
      <div id="leadMessage" class="message"></div>
      <ul id="leadList"></ul>
    </div>
  </div>

  <!-- Projects -->
  <div id="tab2" class="tab-content" style="display:none">
    <div class="card">
      <h2>New Project</h2>
      <input type="text" id="projectName" placeholder="Project Name">
      <select id="projectStatus">
        <option value="Planning">Planning</option>
        <option value="In Progress">In Progress</option>
        <option value="Review">Review</option>
        <option value="Completed">Completed</option>
      </select>
      <button onclick="addProject()">Add Project</button>
      <ul id="projectList"></ul>
    </div>
  </div>

  <!-- Sales -->
  <div id="tab3" class="tab-content" style="display:none">
    <div class="card">
      <h2>New Sale / Revenue</h2>
      <input type="text" id="saleDesc" placeholder="Sale Description">
      <input type="number" id="saleAmount" placeholder="Amount ($)" step="0.01">
      <button onclick="addSale()">Record Sale</button>
      <ul id="saleList"></ul>
    </div>
  </div>

  <!-- Tasks -->
  <div id="tab4" class="tab-content" style="display:none">
    <div class="card">
      <h2>New Task</h2>
      <input type="text" id="taskTitle" placeholder="Task description">
      <select id="taskPriority">
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>
      <button onclick="addTask()">Add Task</button>
      <ul id="taskList"></ul>
    </div>
  </div>

  <!-- Expenses -->
  <div id="tab5" class="tab-content" style="display:none">
    <div class="card">
      <h2>New Expense</h2>
      <input type="text" id="expDesc" placeholder="Expense description">
      <input type="number" id="expAmount" placeholder="Amount ($)" step="0.01">
      <button onclick="addExpense()">Add Expense</button>
      <ul id="expenseList"></ul>
    </div>
  </div>

  <script>
    let db = { leads: [], projects: [], sales: [], tasks: [], expenses: [] };

    function loadData() {
      const saved = localStorage.getItem('flowforce_commercial');
      if (saved) db = JSON.parse(saved);
      renderAll();
    }

    function saveData() {
      localStorage.setItem('flowforce_commercial', JSON.stringify(db));
    }

    function showTab(n) {
      document.querySelectorAll('.tab-content').forEach(div => div.style.display = 'none');
      document.getElementById('tab' + n).style.display = 'block';
      document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === n));
      if (n === 0) updateDashboard();
    }

    function renderAll() {
      // Leads
      document.getElementById('leadList').innerHTML = db.leads.map(l => `<li><strong>${l.name}</strong> - ${l.contact} (${l.status})</li>`).join('');
      // Projects
      document.getElementById('projectList').innerHTML = db.projects.map(p => `<li>${p.name} - ${p.status}</li>`).join('');
      // Sales
      document.getElementById('saleList').innerHTML = db.sales.map(s => `<li>$${s.amount} - ${s.desc}</li>`).join('');
      // Tasks
      document.getElementById('taskList').innerHTML = db.tasks.map(t => `<li>${t.title} (${t.priority})</li>`).join('');
      // Expenses
      document.getElementById('expenseList').innerHTML = db.expenses.map(e => `<li>$${e.amount} - ${e.desc}</li>`).join('');
    }

    function updateDashboard() {
      document.getElementById('totalLeads').textContent = db.leads.length;
      document.getElementById('activeProjects').textContent = db.projects.length;
    }

    // Add Functions
    function addLead() {
      const name = document.getElementById('leadName').value.trim();
      const contact = document.getElementById('leadContact').value.trim();
      const status = document.getElementById('leadStatus').value;
      if (name) {
        db.leads.push({name, contact, status});
        saveData();
        renderAll();
        updateDashboard();
        document.getElementById('leadName').value = '';
        document.getElementById('leadContact').value = '';
        alert('✅ Lead added!');
      }
    }

    function addProject() {
      const name = document.getElementById('projectName').value.trim();
      const status = document.getElementById('projectStatus').value;
      if (name) {
        db.projects.push({name, status});
        saveData();
        renderAll();
        updateDashboard();
        document.getElementById('projectName').value = '';
        alert('✅ Project added!');
      }
    }

    function addSale() {
      const desc = document.getElementById('saleDesc').value.trim();
      const amount = parseFloat(document.getElementById('saleAmount').value);
      if (desc && amount) {
        db.sales.push({desc, amount});
        saveData();
        renderAll();
        document.getElementById('saleDesc').value = '';
        document.getElementById('saleAmount').value = '';
        alert('✅ Sale recorded!');
      }
    }

    function addTask() {
      const title = document.getElementById('taskTitle').value.trim();
      const priority = document.getElementById('taskPriority').value;
      if (title) {
        db.tasks.push({title, priority});
        saveData();
        renderAll();
        document.getElementById('taskTitle').value = '';
        alert('✅ Task added!');
      }
    }

    function addExpense() {
      const desc = document.getElementById('expDesc').value.trim();
      const amount = parseFloat(document.getElementById('expAmount').value);
      if (desc && amount) {
        db.expenses.push({desc, amount});
        saveData();
        renderAll();
        document.getElementById('expDesc').value = '';
        document.getElementById('expAmount').value = '';
        alert('✅ Expense added!');
      }
    }

    // Initialize
    loadData();
    showTab(0);
  </script>
</body>
</html>
