<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow-Force • Database</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background: #0f172a; color: #e2e8f0; }
    h1 { text-align: center; color: #60a5fa; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; }
    .tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
    .tab { padding: 12px 24px; background: #1e2937; border: none; color: white; cursor: pointer; border-radius: 8px; font-weight: bold; }
    .tab.active { background: #3b82f6; box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
    .card { background: #1e2937; padding: 25px; border-radius: 12px; margin: 20px 0; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    input, select, textarea { 
      width: 100%; padding: 14px; margin: 10px 0; 
      background: #334155; border: none; border-radius: 8px; 
      color: white; font-size: 16px;
    }
    button { 
      padding: 12px 20px; background: #3b82f6; color: white; 
      border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
    }
    button:hover { background: #2563eb; }
    .message { padding: 10px; margin: 10px 0; border-radius: 6px; text-align: center; }
    .success { background: #166534; color: #86efac; }
    ul { list-style: none; padding: 0; }
    li { 
      padding: 15px; background: #334155; margin: 10px 0; 
      border-radius: 8px; display: flex; justify-content: space-between; align-items: center;
    }
    .delete-btn { background: #ef4444; padding: 6px 12px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>🌊 Flow-Force</h1>
  <p class="subtitle">Global Commercial Industries • Personal Database • Started 07/24/26</p>

  <div class="tabs">
    <button class="tab active" onclick="showTab(0)">Tasks</button>
    <button class="tab" onclick="showTab(1)">Expenses</button>
    <button class="tab" onclick="showTab(2)">Notes</button>
    <button class="tab" onclick="showTab(3)">Goals</button>
  </div>

  <!-- Tasks -->
  <div id="tab0" class="tab-content">
    <div class="card">
      <h2>Add New Task</h2>
      <input type="text" id="task-title" placeholder="Task title or action">
      <select id="task-priority">
        <option value="High">High Priority</option>
        <option value="Medium" selected>Medium Priority</option>
        <option value="Low">Low Priority</option>
      </select>
      <button onclick="addTask()">Add Task</button>
    </div>
    <div id="task-message" class="message"></div>
    <ul id="task-list"></ul>
  </div>

  <!-- Expenses -->
  <div id="tab1" class="tab-content" style="display:none">
    <div class="card">
      <h2>Add Expense</h2>
      <input type="text" id="exp-desc" placeholder="Description (e.g. Office supplies)">
      <input type="number" id="exp-amount" placeholder="Amount ($)" step="0.01">
      <button onclick="addExpense()">Add Expense</button>
    </div>
    <canvas id="expenseChart" height="220"></canvas>
    <div id="expense-message" class="message"></div>
    <ul id="expense-list"></ul>
  </div>

  <!-- Notes -->
  <div id="tab2" class="tab-content" style="display:none">
    <div class="card">
      <h2>New Note / Idea</h2>
      <textarea id="note-text" rows="5" placeholder="Write your note, idea, or observation..."></textarea>
      <button onclick="addNote()">Save Note</button>
    </div>
    <div id="note-message" class="message"></div>
    <ul id="note-list"></ul>
  </div>

  <!-- Goals -->
  <div id="tab3" class="tab-content" style="display:none">
    <div class="card">
      <h2>Add Goal / Target</h2>
      <input type="text" id="goal-title" placeholder="e.g. Reach $10k monthly revenue">
      <button onclick="addGoal()">Add Goal</button>
    </div>
    <div id="goal-message" class="message"></div>
    <ul id="goal-list"></ul>
  </div>

  <script>
    let data = { tasks: [], expenses: [], notes: [], goals: [] };

    function loadData() {
      const saved = localStorage.getItem('flowforce_data');
      if (saved) data = JSON.parse(saved);
      renderAll();
    }

    function saveData() {
      localStorage.setItem('flowforce_data', JSON.stringify(data));
    }

    function showMessage(tabId, text, type = 'success') {
      const msg = document.getElementById(tabId + '-message');
      if (msg) {
        msg.textContent = text;
        msg.className = `message ${type}`;
        setTimeout(() => msg.textContent = '', 3000);
      }
    }

    function showTab(n) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.getElementById('tab' + n).style.display = 'block';
      document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === n));
      if (n === 1) setTimeout(renderExpenseChart, 100);
    }

    function renderAll() {
      // Tasks
      const taskList = document.getElementById('task-list');
      taskList.innerHTML = data.tasks.map((t, i) => `
        <li>
          ${t.title} <small>(${t.priority})</small>
          <button class="delete-btn" onclick="deleteItem('tasks', ${i})">Delete</button>
        </li>
      `).join('');

      // Expenses
      const expenseList = document.getElementById('expense-list');
      expenseList.innerHTML = data.expenses.map((e, i) => `
        <li>$${e.amount} - ${e.desc}
          <button class="delete-btn" onclick="deleteItem('expenses', ${i})">Delete</button>
        </li>
      `).join('');

      // Notes
      const noteList = document.getElementById('note-list');
      noteList.innerHTML = data.notes.map((n, i) => `
        <li>${n.text}
          <button class="delete-btn" onclick="deleteItem('notes', ${i})">Delete</button>
        </li>
      `).join('');

      // Goals
      const goalList = document.getElementById('goal-list');
      goalList.innerHTML = data.goals.map((g, i) => `
        <li>🎯 ${g.title}
          <button class="delete-btn" onclick="deleteItem('goals', ${i})">Delete</button>
        </li>
      `).join('');
    }

    function renderExpenseChart() {
      const ctx = document.getElementById('expenseChart');
      if (window.expChart) window.expChart.destroy();
      
      if (data.expenses.length === 0) return;
      
      const labels = data.expenses.map(e => e.desc.substring(0, 12));
      const amounts = data.expenses.map(e => e.amount);

      window.expChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Expenses ($)',
            data: amounts,
            backgroundColor: '#60a5fa'
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    // Add Functions
    function addTask() {
      const title = document.getElementById('task-title').value.trim();
      const priority = document.getElementById('task-priority').value;
      if (!title) return;
      data.tasks.push({title, priority});
      saveData();
      renderAll();
      document.getElementById('task-title').value = '';
      showMessage('task', 'Task added successfully!');
    }

    function addExpense() {
      const desc = document.getElementById('exp-desc').value.trim();
      const amount = parseFloat(document.getElementById('exp-amount').value);
      if (!desc || !amount) return;
      data.expenses.push({desc, amount});
      saveData();
      renderAll();
      renderExpenseChart();
      document.getElementById('exp-desc').value = '';
      document.getElementById('exp-amount').value = '';
      showMessage('expense', 'Expense added!');
    }

    function addNote() {
      const text = document.getElementById('note-text').value.trim();
      if (!text) return;
      data.notes.push({text});
      saveData();
      renderAll();
      document.getElementById('note-text').value = '';
      showMessage('note', 'Note saved!');
    }

    function addGoal() {
      const title = document.getElementById('goal-title').value.trim();
      if (!title) return;
      data.goals.push({title});
      saveData();
      renderAll();
      document.getElementById('goal-title').value = '';
      showMessage('goal', 'Goal added!');
    }

    function deleteItem(category, index) {
      if (confirm('Delete this item?')) {
        data[category].splice(index, 1);
        saveData();
        renderAll();
        if (category === 'expenses') renderExpenseChart();
      }
    }

    // Start the app
    loadData();
    showTab(0);
  </script>
</body>
</html>
