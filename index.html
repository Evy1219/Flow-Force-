<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow-Force • Commercial OS</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Inter', Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #60a5fa; }
    .subtitle { text-align: center; color: #94a3b8; }
    .tabs button { padding: 12px 20px; margin: 5px; background: #1e2937; border: none; color: white; border-radius: 50px; cursor: pointer; }
    .tabs button.active { background: #3b82f6; }
    .card { background: #1e2937; padding: 25px; border-radius: 16px; margin: 20px 0; }
    input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #334155; border: none; border-radius: 8px; color: white; }
    button { padding: 10px 18px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 5px; }
    li { background: #334155; padding: 15px; margin: 10px 0; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .message { padding: 12px; background: #166534; color: #86efac; border-radius: 10px; text-align: center; margin: 10px 0; display: none; }
  </style>
</head>
<body>
  <h1>🌊 Flow-Force Commercial OS</h1>
  <p class="subtitle">Global Commercial Industries • Business Operations Hub</p>

  <div class="tabs">
    <button class="active" onclick="showTab(0)">Dashboard</button>
    <button onclick="showTab(1)">Leads</button>
    <button onclick="showTab(2)">Projects</button>
    <button onclick="showTab(3)">Tasks</button>
    <button onclick="showTab(4)">Expenses</button>
  </div>

  <!-- Dashboard -->
  <div id="tab0" class="card">
    <h2>Business Overview</h2>
    <canvas id="dashChart" height="200"></canvas>
  </div>

  <!-- Leads -->
  <div id="tab1" class="card" style="display:none">
    <h2>New Lead</h2>
    <input type="text" id="leadName" placeholder="Client / Company">
    <input type="text" id="leadContact" placeholder="Contact Info">
    <select id="leadStatus">
      <option value="New">New</option>
      <option value="Contacted">Contacted</option>
      <option value="Negotiation">Negotiation</option>
      <option value="Closed">Closed</option>
    </select>
    <button onclick="addLead()">Add Lead</button>
    <div id="leadMsg" class="message"></div>
    <ul id="leadList"></ul>
  </div>

  <!-- Projects (Enhanced) -->
  <div id="tab2" class="card" style="display:none">
    <h2>New Project</h2>
    <input type="text" id="projName" placeholder="Project Name">
    <select id="projCategory">
      <option value="Development">Development</option>
      <option value="Marketing">Marketing</option>
      <option value="Sales">Sales</option>
      <option value="Operations">Operations</option>
      <option value="Other">Other</option>
    </select>
    <textarea id="projNotes" placeholder="Notes / Details" rows="3"></textarea>
    <button onclick="addProject()">Add Project</button>
    <div id="projMsg" class="message"></div>
    <ul id="projectList"></ul>
  </div>

  <!-- Tasks -->
  <div id="tab3" class="card" style="display:none">
    <h2>New Task</h2>
    <input type="text" id="taskTitle" placeholder="Task">
    <select id="taskPriority">
      <option value="High">High</option>
      <option value="Medium">Medium</option>
      <option value="Low">Low</option>
    </select>
    <button onclick="addTask()">Add Task</button>
    <div id="taskMsg" class="message"></div>
    <ul id="taskList"></ul>
  </div>

  <!-- Expenses -->
  <div id="tab4" class="card" style="display:none">
    <h2>New Expense</h2>
    <input type="text" id="expDesc" placeholder="Description">
    <input type="number" id="expAmount" placeholder="Amount" step="0.01">
    <button onclick="addExpense()">Add Expense</button>
    <div id="expMsg" class="message"></div>
    <ul id="expenseList"></ul>
  </div>

  <script>
    let db = { leads: [], projects: [], tasks: [], expenses: [] };

    function loadData() {
      const saved = localStorage.getItem('flowforce_v2');
      if (saved) db = JSON.parse(saved);
      renderAll();
      updateDashboard();
    }

    function saveData() {
      localStorage.setItem('flowforce_v2', JSON.stringify(db));
    }

    function showMessage(id, text) {
      const el = document.getElementById(id);
      if (el) {
        el.textContent = text;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 2500);
      }
    }

    function showTab(n) {
      document.querySelectorAll('.card').forEach(c => c.style.display = 'none');
      document.getElementById('tab' + n).style.display = 'block';
      document.querySelectorAll('.tabs button').forEach((b,i) => b.classList.toggle('active', i===n));
    }

    function renderAll() {
      // Leads
      document.getElementById('leadList').innerHTML = db.leads.map((l,i) => `
        <li>
          <span><strong>${l.name}</strong> - ${l.contact} (${l.status})</span>
          <button onclick="deleteItem('leads', ${i})">Delete</button>
        </li>
      `).join('');

      // Projects
      document.getElementById('projectList').innerHTML = db.projects.map((p,i) => `
        <li>
          <span><strong>${p.name}</strong> [${p.category}]<br>${p.notes}</span>
          <button onclick="deleteItem('projects', ${i})">Delete</button>
        </li>
      `).join('');

      // Tasks & Expenses (similar)
      document.getElementById('taskList').innerHTML = db.tasks.map((t,i) => `<li>${t.title} (${t.priority}) <button onclick="deleteItem('tasks', ${i})">Delete</button></li>`).join('');
      document.getElementById('expenseList').innerHTML = db.expenses.map((e,i) => `<li>$${e.amount} - ${e.desc} <button onclick="deleteItem('expenses', ${i})">Delete</button></li>`).join('');
    }

    function updateDashboard() {
      const ctx = document.getElementById('dashChart');
      if (window.myChart) window.myChart.destroy();
      window.myChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Leads', 'Projects', 'Tasks', 'Expenses'],
          datasets: [{ label: 'Count', data: [db.leads.length, db.projects.length, db.tasks.length, db.expenses.length], backgroundColor: '#60a5fa' }]
        }
      });
    }

    function addLead() {
      const name = document.getElementById('leadName').value.trim();
      const contact = document.getElementById('leadContact').value.trim();
      const status = document.getElementById('leadStatus').value;
      if (name) {
        db.leads.push({name, contact, status});
        saveData();
        renderAll();
        updateDashboard();
        document.getElementById('leadName').value = '';
        document.getElementById('leadContact').value = '';
        showMessage('leadMsg', '✅ Lead added successfully!');
      }
    }

    function addProject() {
      const name = document.getElementById('projName').value.trim();
      const category = document.getElementById('projCategory').value;
      const notes = document.getElementById('projNotes').value.trim();
      if (name) {
        db.projects.push({name, category, notes});
        saveData();
        renderAll();
        updateDashboard();
        document.getElementById('projName').value = '';
        document.getElementById('projNotes').value = '';
        showMessage('projMsg', '✅ Project added successfully!');
      }
    }

    function addTask() {
      const title = document.getElementById('taskTitle').value.trim();
      const priority = document.getElementById('taskPriority').value;
      if (title) {
        db.tasks.push({title, priority});
        saveData();
        renderAll();
        updateDashboard();
        document.getElementById('taskTitle').value = '';
        showMessage('taskMsg', '✅ Task added successfully!');
      }
    }

    function addExpense() {
      const desc = document.getElementById('expDesc').value.trim();
      const amount = parseFloat(document.getElementById('expAmount').value);
      if (desc && amount) {
        db.expenses.push({desc, amount});
        saveData();
        renderAll();
        updateDashboard();
        document.getElementById('expDesc').value = '';
        document.getElementById('expAmount').value = '';
        showMessage('expMsg', '✅ Expense added successfully!');
      }
    }

    function deleteItem(type, index) {
      if (confirm("Delete this item?")) {
        db[type].splice(index, 1);
        saveData();
        renderAll();
        updateDashboard();
      }
    }

    // Start
    loadData();
    showTab(0);
  </script>
</body>
</html>
