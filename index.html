<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flow-Force Test</title>
</head>
<body>
  <h1>Flow-Force Test</h1>
  <input type="text" id="input" placeholder="Type something">
  <button onclick="testAdd()">Add</button>
  <p id="output"></p>

  <script>
    function testAdd() {
      const text = document.getElementById('input').value;
      document.getElementById('output').innerHTML = "✅ You added: " + text + "<br>Button is working!";
      console.log("Button clicked! Text:", text);
    }
    console.log("JavaScript loaded successfully");
  </script>
</body>
</html>
