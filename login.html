<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flow Force Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:#0f172a;

overflow:hidden;

}

/* Animated Background */

body::before{

content:"";

position:absolute;

width:180%;

height:180%;

background:

radial-gradient(circle,#2563eb22 0%,transparent 60%),

radial-gradient(circle,#3b82f622 0%,transparent 60%),

radial-gradient(circle,#60a5fa22 0%,transparent 60%);

animation:bgMove 18s linear infinite;

}

@keyframes bgMove{

0%{transform:rotate(0deg);}

100%{transform:rotate(360deg);}

}

.loginBox{

position:relative;

z-index:2;

width:420px;

background:#1e293bcc;

backdrop-filter:blur(16px);

padding:40px;

border-radius:18px;

box-shadow:0 25px 80px rgba(0,0,0,.45);

}

.logo{

font-size:38px;

text-align:center;

margin-bottom:10px;

}

h1{

text-align:center;

color:white;

margin-bottom:6px;

font-size:30px;

}

.subtitle{

text-align:center;

color:#94a3b8;

margin-bottom:35px;

}

input{

width:100%;

padding:14px;

margin-bottom:16px;

border:none;

outline:none;

background:#334155;

color:white;

border-radius:10px;

font-size:15px;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:10px;

font-size:15px;

cursor:pointer;

transition:.25s;

}

#loginBtn{

background:#2563eb;

color:white;

margin-bottom:12px;

}

#loginBtn:hover{

background:#1d4ed8;

}

#createBtn{

background:#475569;

color:white;

margin-bottom:15px;

}

#createBtn:hover{

background:#64748b;

}

#forgot{

display:block;

text-align:center;

text-decoration:none;

color:#60a5fa;

margin-top:8px;

cursor:pointer;

}

#error{

margin-top:20px;

text-align:center;

color:#ef4444;

min-height:20px;

}

.loading{

display:none;

text-align:center;

margin-top:20px;

color:#60a5fa;

}

.footer{

margin-top:30px;

font-size:13px;

text-align:center;

color:#64748b;

}

</style>

</head>

<body>

<div class="loginBox">

<div class="logo">🌊</div>

<h1>Flow Force</h1>

<div class="subtitle">

Commercial Operations Platform

</div>

<input
id="email"
type="email"
placeholder="Email Address">

<input
id="password"
type="password"
placeholder="Password">

<button id="loginBtn">

Login

</button>

<button id="createBtn">

Create Account

</button>

<a id="forgot">

Forgot Password?

</a>

<div id="loading" class="loading">

Signing in...

</div>

<div id="error"></div>

<div class="footer">

© 2026 Flow Force Technologies

</div>

</div>

<script type="module" src="js/auth.js"></script>

</body>

</html>
